        city_id: {type: string, description: Required when the role scope is `city`.}
        stakeholder_id: {type: string, format: uuid, description: Required when the role scope is `stakeholder`.}

    JwtClaims:
      type: object
      description: |
        Claims added by the Supabase custom access token hook for actors. Anonymous devices
        get only the standard claims (`is_anonymous = true`, `cp_grants = []`). RLS reads
        `cp_grants` through `has_permission(perm, city_id, stakeholder_id)`: a global grant
        matches anything, a city grant matches that city and its stakeholders, a stakeholder
        grant matches only that stakeholder. Because a JWT lives up to 1 h, sensitive actions
        (override approval, invitations, role changes) re-check `user_roles` in the database.
      required: [sub, role, is_anonymous, cp_grants]
      properties:
        sub: {type: string, format: uuid}
        role: {enum: [authenticated]}
        is_anonymous: {type: boolean}
        email: {type: string, format: email}
        cp_profile_active: {type: boolean}
        cp_grants:
          type: array
          items:
            type: object
            required: [role, scope, permissions]
            properties:
              role: {type: string}
              scope: {enum: [global, city, stakeholder]}
              city_id: {type: ['string', 'null']}
              stakeholder_id: {type: ['string', 'null'], format: uuid}
              permissions:
                type: array
                items:
                  type: string
                  examples: [dispatches.read, dispatches.respond, dispatches.redispatch, resolutions.submit, resolutions.approve, members.manage, users.manage, categories.write, categories.activate, domains.write, stakeholders.manage, reports.moderate, audit.read]
      examples:
        - sub: 7d3b6c1e-2a4f-4e0b-9a1c-5b6d7e8f9a0b
          role: authenticated
          is_anonymous: false
          email: operaciones@coop-ejemplo.ec
          cp_profile_active: true
          cp_grants:
            - role: stakeholder_admin
              scope: stakeholder
              city_id: ambato
              stakeholder_id: 6f1c2d3e-4b5a-4c7d-8e9f-0a1b2c3d4e5f
              permissions: [dispatches.read, dispatches.respond, resolutions.submit, resolutions.approve, members.manage]

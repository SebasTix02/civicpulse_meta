[project]
name = "civicpulse-orchestrator"
version = "0.1.0"
description = "CivicPulse orchestrator: Supabase webhooks -> spec, SAM 3.1, classifier, consensus, closure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python-headless>=4.10,<5", "pillow>=10"]
modal = ["modal>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["civicpulse"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
